[package]
name = "el_silbon"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "El Silbón — The Return: first local playable folk-horror encounter (Bevy)."
license = "MIT OR Apache-2.0"
publish = false
default-run = "el_silbon"

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = [
    "3d",
    "ui",
    "audio",
    "wav",
    "keyboard",
    "mouse",
    # The launch splash and the window icon decode PNGs.
    "png",
    # The Tripo models' textures (tools/models/tripo.py) are JPEG.
    "jpeg",
] }
renet = "=2.0.0"
renet_netcode = "=2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only for the window's icon types; the exact version bevy_winit uses, so the
# types agree (its features come from bevy_winit).
winit = { version = "=0.30.13", default-features = false }

[build-dependencies]
# Compiles the branding icon into the Windows executable (see build.rs).
winresource = { version = "0.1.31", default-features = false }

[lib]
name = "el_silbon"
path = "src/lib.rs"

[[bin]]
name = "el_silbon"
path = "src/main.rs"

# Bevy recommendation: keep our code quick to rebuild, dependencies optimized.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
